<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOJO x Demon Slayer Gacha & Boss Battle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1c29 0%, #08090d 100%);
            color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 20px 10px;
        }

        #startScreen { text-align: center; width: 100%; margin-top: 25vh; }
        .game-title {
            font-size: 2rem; margin-bottom: 10px; color: #ff007f;
            text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
        }
        .subtitle { font-size: 1rem; color: #aaa; margin-bottom: 40px; }
        .btn-start {
            padding: 16px 45px; font-size: 1.3rem; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #00d2ff, #0072ff);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        #gameScreen { display: none; text-align: center; width: 100%; max-width: 500px; }
        
        .counter-box {
            font-size: 0.9rem; color: #ff007f; margin-top: 5px;
            background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 20px; display: inline-block;
        }

        /* ส่วนโซนบอส */
        .boss-container {
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }
        .boss-name { font-size: 1.3rem; font-weight: bold; color: #ff4757; text-shadow: 0 0 10px #ff4757; }
        .hp-bar-bg {
            width: 100%; height: 20px; background: #222; border-radius: 10px;
            margin: 10px 0; overflow: hidden; border: 1px solid #444;
        }
        .hp-bar-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff0055, #ff4757);
            transition: width 0.3s ease;
        }
        .battle-log { font-size: 0.85rem; color: #ffcc00; height: 20px; font-weight: bold; }

        .card-container { perspective: 1000px; margin: 15px auto; width: 200px; height: 280px; }
        .card {
            width: 100%; height: 100%; border-radius: 16px;
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 3px solid rgba(255,255,255,0.2); padding: 15px;
        }
        
        .card-back { background: linear-gradient(135deg, #2c3e50, #000000); border-color: #00d2ff; }
        .card-back::after { content: "❖"; font-size: 50px; color: #00d2ff; text-shadow: 0 0 15px #00d2ff; }

        .card-front { transform: rotateY(180deg); background: #151515; text-align: center; }
        .rarity { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .anime-tag { font-size: 0.75rem; opacity: 0.8; }

        /* สีการ์ด */
        .ur { border-color: #ff0033; box-shadow: 0 0 25px #ff0033; color: #ff0033; }
        .ssr { border-color: #ffd700; box-shadow: 0 0 20px #ffd700; color: #ffd700; }
        .sr { border-color: #a855f7; box-shadow: 0 0 15px #a855f7; color: #a855f7; }
        .r { border-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; color: #3b82f6; }
        .c { border-color: #9ca3af; color: #9ca3af; }

        .btn-action {
            padding: 12px 28px; font-size: 1.1rem; font-weight: bold; color: #fff;
            border: none; border-radius: 50px; cursor: pointer; margin: 5px;
        }
        .btn-draw {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .btn-attack {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        .btn-toggle-album {
            padding: 8px 16px; font-size: 0.85rem; font-weight: bold; color: #00d2ff;
            background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff;
            border-radius: 20px; cursor: pointer; margin-top: 10px;
        }

        #albumSection {
            margin-top: 15px; width: 100%;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 15px;
        }
        .album-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px;
        }
        .album-item {
            background: #111; border: 2px solid #333; border-radius: 10px;
            padding: 8px; font-size: 0.8rem; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 80px; opacity: 0.4; cursor: pointer;
        }
        .album-item.unlocked { opacity: 1; }
        .album-item.selected { border-color: #00d2ff; box-shadow: 0 0 10px #00d2ff; }
        .album-item .count-badge {
            position: absolute; top: 5px; right: 8px; font-size: 0.7rem;
            background: #ff007f; color: white; padding: 2px 5px; border-radius: 10px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <h1 class="game-title">JOJO x DEMON SLAYER</h1>
        <p class="subtitle">สุ่มการ์ด & พิชิตบอสสุดแกร่ง</p>
        <button type="button" class="btn-start" onclick="startGame()">▶ กดเพื่อเข้าสู่เกม</button>
    </div>

    <div id="gameScreen">
        <div class="boss-container">
            <div class="boss-name" id="bossName">👹 Dio Over Heaven</div>
            <div class="hp-bar-bg">
                <div class="hp-bar-fill" id="hpBar"></div>
            </div>
            <div style="font-size:0.85rem;" id="hpText">HP: 500,000 / 500,000</div>
            <div class="battle-log" id="battleLog">เตรียมตัวเข้าสู่การต่อสู้!</div>
        </div>

        <div class="counter-box">สุ่มไปแล้ว: <span id="drawCount">0</span> ครั้ง</div>

        <div class="card-container" onclick="drawCard()">
            <div class="card" id="card">
                <div class="card-face card-back"></div>
                <div class="card-face card-front" id="cardFront">
                    <div class="rarity" id="cardRarity">UR</div>
                    <div class="card-title" id="cardName">ดีโอ (DIO)</div>
                    <div class="anime-tag" id="cardAnime">JoJo Part 3</div>
                </div>
            </div>
        </div>

        <button type="button" class="btn-action btn-draw" onclick="drawCard()">🎲 สุ่มการ์ด</button>
        <button type="button" class="btn-action btn-attack" onclick="attackBoss()">⚔️ โจมตีบอส!</button>
        <br>
        <button type="button" class="btn-toggle-album" onclick="toggleAlbum()">📦 คอลเลกชันการ์ด (<span id="unlockedCount">0</span>/12)</button>

        <div id="albumSection">
            <h3 style="font-size: 1rem; color: #00d2ff;">คอลเลกชัน (คลิกการ์ดที่ปลดล็อกเพื่อใช้สู้)</h3>
            <div class="album-grid" id="albumGrid"></div>
        </div>
    </div>

    <script>
        const bosses = [
            { name: "⚡ Dio Over Heaven", maxHp: 500000, hp: 500000 },
            { name: "🩸 มุซัน ร่างปีศาจ", maxHp: 300000, hp: 300000 }
        ];
        let currentBossIndex = 0;

        const pool = {
            ur: [
                { id: 1, name: "ดีโอ แบรนโด (DIO)", anime: "JoJo Part 3", class: "ur", atk: 25000 },
                { id: 2, name: "คิบุตสึจิ มุซัน", anime: "Demon Slayer", class: "ur", atk: 22000 }
            ],
            ssr: [
                { id: 3, name: "คูโจ โจทาโร่", anime: "JoJo Part 3", class: "ssr", atk: 8000 },
                { id: 4, name: "คามาโดะ ทันจิโร่", anime: "Demon Slayer", class: "ssr", atk: 7000 },
                { id: 5, name: "เร็นโกคุ เคียวจูโร่", anime: "Demon Slayer", class: "ssr", atk: 7500 },
                { id: 6, name: "โจรูโน่ โจบาน่า", anime: "JoJo Part 5", class: "ssr", atk: 8500 }
            ],
            sr: [
                { id: 7, name: "อากาสึมะ เซ็นอิทซึ", anime: "Demon Slayer", class: "sr", atk: 2500 },
                { id: 8, name: "ฮาชิบิระ อิโนะสึเกะ", anime: "Demon Slayer", class: "sr", atk: 2200 },
                { id: 9, name: "คิชิเบะ โรฮัง", anime: "JoJo Part 4", class: "sr", atk: 2000 }
            ],
            r: [
                { id: 10, name: "คามาโดะ เนซึโกะ", anime: "Demon Slayer", class: "r", atk: 800 },
                { id: 11, name: "สปีดวากอน", anime: "JoJo Part 1", class: "r", atk: 600 }
            ],
            c: [
                { id: 12, name: "อสูรวัด (Temple Demon)", anime: "Demon Slayer", class: "c", atk: 200 }
            ]
        };

        const allCards = [...pool.ur, ...pool.ssr, ...pool.sr, ...pool.r, ...pool.c];
        const userInventory = {};
        let activeCard = null; // การ์ดที่ใช้อยู่ปัจจุบัน

        let isAnimating = false;
        let totalDraws = 0;

        function startGame() {
            var startBox = document.getElementById('startScreen');
            var gameBox = document.getElementById('gameScreen');
            if (startBox) startBox.style.display = 'none';
            if (gameBox) gameBox.style.display = 'block';
            initAlbum();
            updateBossUI();
        }

        function initAlbum() {
            const grid = document.getElementById('albumGrid');
            if (!grid) return;
            grid.innerHTML = '';
            
            allCards.forEach(function(card) {
                userInventory[card.id] = userInventory[card.id] || 0;

                const item = document.createElement('div');
                item.className = 'album-item ' + card.class;
                item.id = 'album-item-' + card.id;
                item.onclick = function() { selectCardToBattle(card); };
                item.innerHTML = `
                    <span class="count-badge" id="count-${card.id}" style="display:none;">x0</span>
                    <div style="font-weight:bold; font-size:0.75rem;" id="rarity-${card.id}">🔒 ล็อกอยู่</div>
                    <div style="margin-top:4px;" id="name-${card.id}">???</div>
                    <div style="font-size:0.65rem; color:#aaa;" id="atk-${card.id}">ATK: ${card.atk}</div>
                `;
                grid.appendChild(item);
            });
        }

        function selectCardToBattle(card) {
            if (userInventory[card.id] > 0) {
                activeCard = card;
                document.querySelectorAll('.album-item').forEach(el => el.classList.remove('selected'));
                document.getElementById('album-item-' + card.id).classList.add('selected');
                document.getElementById('battleLog').innerText = `เลือก ${card.name} เข้าสู่การต่อสู้! (ATK: ${card.atk})`;
            }
        }

        function attackBoss() {
            if (!activeCard) {
                document.getElementById('battleLog').innerText = '❌ โปรดสุ่มการ์ดหรือเลือกการ์ดในคอลเลกชันก่อน!';
                return;
            }

            let boss = bosses[currentBossIndex];
            if (boss.hp <= 0) return;

            // สุ่มพลังโจมตีคริติคอล
            let isCrit = Math.random() < 0.2;
            let damage = isCrit ? activeCard.atk * 2 : activeCard.atk;

            boss.hp = Math.max(0, boss.hp - damage);
            updateBossUI();

            if (isCrit) {
                document.getElementById('battleLog').innerText = `💥 ติดคริติคอล! ${activeCard.name} โจมตีใส่ ${damage} ดาเมจ!`;
            } else {
                document.getElementById('battleLog').innerText = `⚔️ ${activeCard.name} โจมตีใส่บอส ${damage} ดาเมจ!`;
            }

            if (boss.hp <= 0) {
                document.getElementById('battleLog').innerText = `🎉 พิชิต ${boss.name} สำเร็จ!`;
                setTimeout(nextBoss, 1500);
            }
        }

        function nextBoss() {
            currentBossIndex = (currentBossIndex + 1) % bosses.length;
            bosses[currentBossIndex].hp = bosses[currentBossIndex].maxHp;
            updateBossUI();
            document.getElementById('battleLog').innerText = `⚠️ บอสตัวใหม่ปรากฏตัว: ${bosses[currentBossIndex].name}!`;
        }

        function updateBossUI() {
            let boss = bosses[currentBossIndex];
            document.getElementById('bossName').innerText = boss.name;
            document.getElementById('hpText').innerText = `HP: ${boss.hp.toLocaleString()} / ${boss.maxHp.toLocaleString()}`;
            
            let percent = (boss.hp / boss.maxHp) * 100;
            document.getElementById('hpBar').style.width = percent + '%';
        }

        function toggleAlbum() {
            const album = document.getElementById('albumSection');
            if (album) {
                album.style.display = (album.style.display === 'none') ? 'block' : 'none';
            }
        }

        function getRandomCard() {
            const chance = Math.random() * 100;
            let selectedRarity = "Common";
            let selectedList = pool.c;

            if (chance < 0.1) {
                selectedRarity = "UR";
                selectedList = pool.ur;
            } else if (chance < 4.8) {
                selectedRarity = "SSR";
                selectedList = pool.ssr;
            } else if (chance < 29.8) {
                selectedRarity = "SR";
                selectedList = pool.sr;
            } else if (chance < 65.0) {
                selectedRarity = "R";
                selectedList = pool.r;
            } else {
                selectedRarity = "Common";
                selectedList = pool.c;
            }

            const randomItem = selectedList[Math.floor(Math.random() * selectedList.length)];
            return {
                ...randomItem,
                rarity: selectedRarity
            };
        }

        function drawCard() {
            if (isAnimating) return;
            isAnimating = true;

            totalDraws++;
            document.getElementById('drawCount').innerText = totalDraws;

            const card = document.getElementById('card');
            const cardFront = document.getElementById('cardFront');
            
            card.classList.remove('flipped');

            setTimeout(function() {
                const random = getRandomCard();
                activeCard = random; // ตั้งการ์ดล่าสุดเป็นหลักสำหรับสู้ทันที
                
                cardFront.className = "card-face card-front " + random.class;
                document.getElementById('cardRarity').innerText = random.rarity;
                document.getElementById('cardName').innerText = random.name;
                document.getElementById('cardAnime').innerText = random.anime;

                userInventory[random.id] = (userInventory[random.id] || 0) + 1;
                updateAlbum(random);

                card.classList.add('flipped');
                isAnimating = false;
            }, 300);
        }

        function updateAlbum(card) {
            const item = document.getElementById('album-item-' + card.id);
            const countBadge = document.getElementById('count-' + card.id);
            
            if (item) {
                item.classList.add('unlocked');
                document.getElementById('rarity-' + card.id).innerText = card.rarity;
                document.getElementById('name-' + card.id).innerText = card.name;
                
                if (countBadge) {
                    countBadge.innerText = 'x' + userInventory[card.id];
                    countBadge.style.display = 'block';
                }

                let unlockedTypes = 0;
                for (let key in userInventory) {
                    if (userInventory[key] > 0) unlockedTypes++;
                }
                document.getElementById('unlockedCount').innerText = unlockedTypes;
            }
        }
    </script>
</body>
</html>

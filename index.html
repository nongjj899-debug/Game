<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มการ์ดแฟนตาซี</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1c29 0%, #08090d 100%);
            color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* หน้ากดเข้าเกม */
        #startScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; width: 100%; height: 100vh;
        }
        .game-title {
            font-size: 2.5rem; margin-bottom: 10px; color: #ff007f;
            text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            letter-spacing: 2px;
        }
        .subtitle { font-size: 1rem; color: #aaa; margin-bottom: 40px; }
        .btn-start {
            padding: 16px 45px; font-size: 1.4rem; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #00d2ff, #0072ff);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0,210,255,0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 30px rgba(0,210,255,0.8); }
        }

        /* หน้าเล่นเกมสุ่มการ์ด (ซ่อนไว้ก่อน) */
        #gameScreen { display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        .card-container { perspective: 1000px; margin: 25px 0; }
        .card {
            width: 220px; height: 320px; border-radius: 16px;
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 3px solid rgba(255,255,255,0.2); padding: 20px;
        }
        
        .card-back { background: linear-gradient(135deg, #2c3e50, #000000); border-color: #00d2ff; }
        .card-back::after { content: "❖"; font-size: 60px; color: #00d2ff; text-shadow: 0 0 15px #00d2ff; }

        .card-front { transform: rotateY(180deg); background: #151515; text-align: center; }
        .rarity { font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .card-title { font-size: 1.4rem; font-weight: bold; }

        /* สีตามระดับความแรร์ */
        .ur { border-color: #ffd700; box-shadow: 0 0 25px #ffd700; color: #ffd700; }
        .ssr { border-color: #ff007f; box-shadow: 0 0 20px #ff007f; color: #ff007f; }
        .sr { border-color: #a855f7; box-shadow: 0 0 15px #a855f7; color: #a855f7; }
        .r { border-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; color: #3b82f6; }
        .c { border-color: #9ca3af; color: #9ca3af; }

        .btn-draw {
            padding: 14px 36px; font-size: 1.2rem; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .btn-draw:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- หน้าแรกสำหรับกดเข้าเกม -->
    <div id="startScreen">
        <h1 class="game-title">GACHA WORLD</h1>
        <p class="subtitle">ตำนานการ์ดเวทมนตร์</p>
        <button class="btn-start" onclick="startGame()">▶ กดเพื่อเข้าสู่เกม</button>
    </div>

    <!-- หน้าสุ่มการ์ด -->
    <div id="gameScreen">
        <h1 style="font-size: 1.5rem; color: #ff007f; text-shadow: 0 0 10px #ff007f;">✨ สุ่มการ์ด ✨</h1>

        <div class="card-container" onclick="drawCard()">
            <div class="card" id="card">
                <div class="card-face card-back"></div>
                <div class="card-face card-front" id="cardFront">
                    <div class="rarity" id="cardRarity">SSR</div>
                    <div class="card-title" id="cardName">มังกรทอง</div>
                </div>
            </div>
        </div>

        <button class="btn-draw" onclick="drawCard()">สุ่มการ์ด!</button>
    </div>

    <script>
        const cardList = [
            { name: "มังกรสุริยะเทพ", rarity: "UR", class: "ur" },
            { name: "จอมเวทอนันต์", rarity: "SSR", class: "ssr" },
            { name: "อัศวินเกราะเหล็ก", rarity: "SR", class: "sr" },
            { name: "นักธนูพุ่มไม้", rarity: "R", class: "r" },
            { name: "สไลม์ตัวน้อย", rarity: "Common", class: "c" }
        ];

        let isAnimating = false;

        // ฟังก์ชันสลับหน้ากดเข้าเกม
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
        

        // ฟังก์ชันสุ่มการ์ด
        function drawCard() {
            if (isAnimating) return;
            isAnimating = true;

            const card = document.getElementById('card');
            const cardFront = document.getElementById('cardFront');
            
            card.classList.remove('flipped');

            setTimeout(() => {
                const random = cardList[Math.floor(Math.random() * cardList.length)];
                
                cardFront.className = "card-face card-front " + random.class;
                document.getElementById('cardRarity').innerText = random.rarity;
                document.getElementById('cardName').innerText = random.name;

                card.classList.add('flipped');
                isAnimating = false;
            }, 300);
        }
    </script>
</body>
</html>

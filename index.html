<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOJO x Demon Slayer Gacha</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; }
        #startScreen { text-align: center; margin-top: 20vh; }
        .title { font-size: 2rem; color: #ff007f; margin-bottom: 20px; font-weight: bold; }
        .btn { padding: 12px 24px; font-size: 1rem; font-weight: bold; color: #fff; background: #0072ff; border: none; border-radius: 25px; cursor: pointer; margin: 5px; }
        .btn-draw { background: #ff007f; }
        .btn-attack { background: #ff4757; width: 100%; margin-top: 10px; }
        .btn-claim { background: #00b894; padding: 4px 10px; font-size: 0.8rem; }
        .btn-claim:disabled { background: #555; }
        #gameScreen { display: none; width: 100%; max-width: 450px; text-align: center; }
        .status-bar { display: flex; justify-content: space-around; background: #222; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 0.85rem; }
        .boss-box { background: #2a0813; border: 2px solid #ff0055; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .hp-bar { width: 100%; height: 16px; background: #444; border-radius: 8px; overflow: hidden; margin: 8px 0; }
        .hp-fill { height: 100%; width: 100%; background: #ff0055; transition: width 0.3s; }
        .quest-box { background: #222; border-radius: 10px; padding: 10px; margin-bottom: 15px; text-align: left; font-size: 0.85rem; }
        .quest-item { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
        .card-display { width: 180px; height: 250px; background: #222; border: 3px solid #ff007f; border-radius: 12px; margin: 15px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; }
        .rarity-tag { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .card-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .ur { border-color: #ff0033; color: #ff0033; }
        .ssr { border-color: #ffd700; color: #ffd700; }
        .sr { border-color: #a855f7; color: #a855f7; }
        .r { border-color: #3b82f6; color: #3b82f6; }
        .c { border-color: #aaa; color: #aaa; }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="title">JOJO x DEMON SLAYER</div>
        <button type="button" class="btn" onclick="startGame()">▶ เข้าสู่เกม</button>
    </div>
    <div id="gameScreen">
        <div class="status-bar">
            <div>💎 <span id="gemCount">10</span></div>
            <div>สุ่ม: <span id="drawCount">0</span></div>
            <div>การันตี: <span id="pityCount">0</span>/25</div>
        </div>
        <div class="boss-box">
            <h3 id="bossName" style="color: #ff4757;">⚡ Dio Over Heaven</h3>
            <div class="hp-bar"><div class="hp-fill" id="hpBar"></div></div>
            <div id="hpText" style="font-size:0.8rem;">HP: 500,000 / 500,000</div>
            <div id="battleLog" style="font-size:0.8rem; color:#ffd700; margin-top:5px;">เตรียมตัวสู้!</div>
            <button type="button" class="btn btn-attack" onclick="attackBoss()">⚔️ โจมตีบอส!</button>
        </div>
        <div class="quest-box">
            <div style="font-weight:bold; color:#00d2ff; margin-bottom:5px;">📜 เควสต์อัญมณี</div>
            <div class="quest-item">
                <span>🎁 รับพลังเวทฟรี</span>
                <button type="button" class="btn btn-claim" id="btnDaily" onclick="claimDaily()">รับ 3 💎</button>
            </div>
            <div class="quest-item">
                <span>🎲 สุ่มครบ 10 ครั้ง (<span id="questDraw">0</span>/10)</span>
                <button type="button" class="btn btn-claim" id="btnQuest" onclick="claimQuest()" disabled>รับ 5 💎</button>
            </div>
        </div>
        <div class="card-display c" id="cardDisplay">
            <div class="rarity-tag" id="cardRarity">COMMON</div>
            <div class="card-name" id="cardName">อสูรวัด</div>
            <div style="font-size:0.75rem; opacity:0.8;" id="cardAnime">Demon Slayer</div>
        </div>
        <button type="button" class="btn btn-draw" onclick="drawCard()">🎲 สุ่มการ์ด (ใช้ 1 💎)</button>
    </div>
    <script>
        var gems = 10;
        var totalDraws = 0;
        var pityCounter = 0;
        var questDrawCount = 0;
        var bosses = [
            { name: "⚡ Dio Over Heaven", maxHp: 500000, hp: 500000 },
            { name: "🩸 มุซัน ร่างปีศาจ", maxHp: 300000, hp: 300000 }
        ];
        var currentBoss = 0;
        var pool = [
            { name: "ดีโอ แบรนโด", anime: "JoJo Part 3", rarity: "UR", class: "ur", atk: 25000 },
            { name: "คิบุตสึจิ มุซัน", anime: "Demon Slayer", rarity: "UR", class: "ur", atk: 22000 },
            { name: "คูโจ โจทาโร่", anime: "JoJo Part 3", rarity: "SSR", class: "ssr", atk: 8000 },
            { name: "คามาโดะ ทันจิโร่", anime: "Demon Slayer", rarity: "SSR", class: "ssr", atk: 7000 },
            { name: "อากาสึมะ เซ็นอิทซึ", anime: "Demon Slayer", rarity: "SR", class: "sr", atk: 2500 },
            { name: "อสูรวัด", anime: "Demon Slayer", rarity: "C", class: "c", atk: 200 }
        ];
        var activeCard = pool[5];
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            updateUI();
        }
        function updateUI() {
            document.getElementById('gemCount').innerText = gems;
            document.getElementById('drawCount').innerText = totalDraws;
            document.getElementById('pityCount').innerText = pityCounter;
            document.getElementById('questDraw').innerText = Math.min(questDrawCount, 10);
            var b = bosses[currentBoss];
            document.getElementById('bossName').innerText = b.name;
            document.getElementById('hpText').innerText = 'HP: ' + b.hp.toLocaleString() + ' / ' + b.maxHp.toLocaleString();
            var pct = (b.hp / b.maxHp) * 100;
            document.getElementById('hpBar').style.width = pct + '%';
        }
        function drawCard() {
            if (gems < 1) { alert('💎 อัญมณีไม่พอ! โปรดรับฟรีจากเควสต์'); return; }
            gems--; totalDraws++; pityCounter++; questDrawCount++;
            if (questDrawCount >= 10) { document.getElementById('btnQuest').disabled = false; }
            var selectedCard;
            if (pityCounter >= 25) {
                pityCounter = 0;
                selectedCard = pool[2];
            } else {
                var rand = Math.floor(Math.random() * pool.length);
                selectedCard = pool[rand];
                if (selectedCard.rarity === 'SSR' || selectedCard.rarity === 'UR') { pityCounter = 0; }
            }
            activeCard = selectedCard;
            var el = document.getElementById('cardDisplay');
            el.className = 'card-display ' + selectedCard.class;
            document.getElementById('cardRarity').innerText = selectedCard.rarity;
            document.getElementById('cardName').innerText = selectedCard.name;
            document.getElementById('cardAnime').innerText = selectedCard.anime;
            updateUI();
        }
        function attackBoss() {
            var b = bosses[currentBoss];
            if (b.hp <= 0) return;
            b.hp = Math.max(0, b.hp - activeCard.atk);
            document.getElementById('battleLog').innerText = '⚔️ ' + activeCard.name + ' โจมตีใส่บอส ' + activeCard.atk.toLocaleString() + ' ดาเมจ!';
            if (b.hp <= 0) {
                gems += 5;
                document.getElementById('battleLog').innerText = '🎉 พิชิต ' + b.name + ' สำเร็จ! รับ +5 💎';
                setTimeout(function() {
                    currentBoss = (currentBoss + 1) % bosses.length;
                    bosses[currentBoss].hp = bosses[currentBoss].maxHp;
                    updateUI();
                }, 1500);
            }
            updateUI();
        }
        function claimDaily() {
            gems += 3;
            document.getElementById('btnDaily').disabled = true;
            document.getElementById('btnDaily').innerText = 'รับแล้ว';
            updateUI();
        }
        function claimQuest() {
            if (questDrawCount >= 10) {
                gems += 5;
                questDrawCount -= 10;
                if (questDrawCount < 10) { document.getElementById('btnQuest').disabled = true; }
                updateUI();
            }
        }
    </script>
</body>
</html>
